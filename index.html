<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cell Rush - Touch Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9edf0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:5;background:#ffffffdf;border-radius:12px;padding:8px 11px;font-size:13px;line-height:1.45;color:#222;box-shadow:0 2px 8px #0002}
#controls{position:fixed;inset:0;pointer-events:none;z-index:6}
#joystick{position:absolute;left:20px;bottom:24px;width:118px;height:118px;border-radius:50%;background:#ffffff66;border:2px solid #fff;pointer-events:auto}
#stick{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:#777b80aa;border:2px solid #fff}
.btn{position:absolute;bottom:32px;width:72px;height:72px;border-radius:50%;border:2px solid #fff;background:#ffffffcc;font-weight:800;color:#222;pointer-events:auto;box-shadow:0 2px 8px #0002}
#split{right:108px} #eject{right:24px}
#lang{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:7;border:0;border-radius:9px;padding:7px;background:#ffffffdf}
#tip{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;background:#ffffffc9;border-radius:10px;padding:5px 9px;font-size:11px;color:#333;white-space:nowrap}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<select id="lang"><option value="ja">日本語</option><option value="en">English</option></select>
<div id="controls">
  <div id="joystick"><div id="stick"></div></div>
  <button class="btn" id="split">SPLIT</button>
  <button class="btn" id="eject">EJECT</button>
</div>
<div id="tip">指で移動　・　SPLIT / EJECT は右下</div>

<script>
const C=document.getElementById("game"),ctx=C.getContext("2d");
let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener("resize",resize);resize();

const lang=document.getElementById("lang"),hud=document.getElementById("hud"),tip=document.getElementById("tip");
const tr={
 ja:{mass:"質量",bots:"BOT",virus:"ウイルス発動: 7粒",note:"ローカル試作 / BOTはテスト用NPC"},
 en:{mass:"Mass",bots:"BOTs",virus:"Virus trigger: 7 pellets",note:"Local prototype / bots are test NPCs"}
};
function text(k){return tr[lang.value][k]}
function hudUpdate(){hud.innerHTML=`<b>CELL RUSH 試作</b><br>${text("mass")}: <b>${Math.floor(player.mass)}</b>　${text("bots")}: <b>15</b><br>${text("virus")}<br><span>${text("note")}</span>`;
tip.textContent=lang.value==="ja"?"指で移動　・　SPLIT / EJECT は右下":"Drag to move · SPLIT / EJECT at bottom-right"}
lang.onchange=hudUpdate;

const WORLD={w:2600,h:1900};
let player,bots,food,viruses,pellets,parts;
const colors=["#e36b6b","#8c72d8","#e4a34b","#55a7a2","#d66aa5","#6e8fd1"];
function rnd(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function newFood(){return {x:rnd(-WORLD.w/2,WORLD.w/2),y:rnd(-WORLD.h/2,WORLD.h/2),r:rnd(3,5)}}
function makeBot(i){
 return {id:i,x:rnd(-WORLD.w/2+80,WORLD.w/2-80),y:rnd(-WORLD.h/2+80,WORLD.h/2-80),
 r:rnd(16,35),mass:400,dx:rnd(-1,1),dy:rnd(-1,1),think:0,name:"BOT "+(i+1),dead:0}
}
function reset(){
 player={x:0,y:0,r:23,mass:529,dirX:0,dirY:0,dead:0};
 food=[];viruses=[];pellets=[];parts=[];bots=[];
 for(let i=0;i<500;i++)food.push(newFood());
 for(let i=0;i<15;i++)bots.push(makeBot(i));
 for(let i=0;i<12;i++)viruses.push({x:rnd(-WORLD.w/2+100,WORLD.w/2-100),y:rnd(-WORLD.h/2+100,WORLD.h/2-100),r:31,flash:0});
 hudUpdate();
}
reset();

let pointerId=null,joyX=0,joyY=0;
const joy=document.getElementById("joystick"),stick=document.getElementById("stick");
function setJoy(cx,cy){
 const r=joy.getBoundingClientRect(),mx=r.left+r.width/2,my=r.top+r.height/2;
 let x=cx-mx,y=cy-my,L=Math.hypot(x,y)||1,max=42;
 if(L>max){x=x/L*max;y=y/L*max}
 joyX=x/max;joyY=y/max;stick.style.transform=`translate(${x}px,${y}px)`;
 player.dirX=joyX;player.dirY=joyY;
}
joy.addEventListener("pointerdown",e=>{joy.setPointerCapture(e.pointerId);setJoy(e.clientX,e.clientY)});
joy.addEventListener("pointermove",e=>{if(e.buttons)setJoy(e.clientX,e.clientY)});
["pointerup","pointercancel"].forEach(t=>joy.addEventListener(t,()=>{joyX=joyY=0;player.dirX=player.dirY=0;stick.style.transform="translate(0,0)"}));

function aim(){
 let x=player.dirX,y=player.dirY;
 if(Math.hypot(x,y)<.05){x=1;y=0}
 return Math.atan2(y,x);
}
document.getElementById("eject").addEventListener("pointerdown",e=>{e.preventDefault();eject()});
document.getElementById("split").addEventListener("pointerdown",e=>{e.preventDefault();split()});

function eject(){
 if(player.mass<35)return;
 const a=aim();player.mass-=15;player.r=12+Math.sqrt(player.mass)*.9;
 pellets.push({x:player.x+Math.cos(a)*(player.r+9),y:player.y+Math.sin(a)*(player.r+9),r:5,vx:Math.cos(a)*10,vy:Math.sin(a)*10,life:260});
}
function split(){
 if(player.mass<160)return;
 const a=aim(),m=player.mass/2;
 player.mass=m;player.r=12+Math.sqrt(m)*.9;
 parts.push({x:player.x+Math.cos(a)*(player.r+18),y:player.y+Math.sin(a)*(player.r+18),r:player.r,mass:m,vx:Math.cos(a)*12,vy:Math.sin(a)*12,life:100});
}
function eatFood(entity){
 for(let i=food.length-1;i>=0;i--){
  if(Math.hypot(entity.x-food[i].x,entity.y-food[i].y)<entity.r){entity.mass+=3;food.splice(i,1)}
 }
}
function clampEntity(e){
 e.x=Math.max(-WORLD.w/2+e.r,Math.min(WORLD.w/2-e.r,e.x));
 e.y=Math.max(-WORLD.h/2+e.r,Math.min(WORLD.h/2-e.r,e.y));
}
function botAI(b){
 let target=null,best=1e9;
 // Prefer nearby food, then a smaller player/bot.
 for(let f of food){let d=(f.x-b.x)**2+(f.y-b.y)**2;if(d<best&&d<420*420){best=d;target=f}}
 let candidates=[player,...bots].filter(q=>q!==b&&!q.dead);
 for(let q of candidates){
  let d=dist(b,q);
  if(q.r>b.r*1.15&&d<260){target={x:b.x-(q.x-b.x),y:b.y-(q.y-b.y)};break}
  if(q.r<b.r*.82&&d<300&&d<best){best=d*d;target=q}
 }
 if(target){
  let dx=target.x-b.x,dy=target.y-b.y,L=Math.hypot(dx,dy)||1;b.dx=dx/L;b.dy=dy/L;
 }else if(Math.random()<.018){let a=rnd(0,Math.PI*2);b.dx=Math.cos(a);b.dy=Math.sin(a)}
}
function updateBot(b){
 if(b.dead)return;
 if(--b.think<=0){b.think=12+Math.floor(Math.random()*25);botAI(b)}
 let speed=Math.max(1.6,7.2-Math.sqrt(b.mass)/18);
 b.x+=b.dx*speed;b.y+=b.dy*speed;clampEntity(b);eatFood(b);
 b.r=12+Math.sqrt(b.mass)*.9;
 // Bot-vs-bot/player capture.
 for(let q of [player,...bots]){
  if(q===b||q.dead)continue;
  let d=dist(b,q);
  if(d<Math.max(2,b.r-q.r*.25)){
   if(b.r>q.r*1.15){b.mass+=q.mass*.65;q.dead=1}
  }
 }
}
function respawnBot(b){b.x=rnd(-WORLD.w/2+100,WORLD.w/2-100);b.y=rnd(-WORLD.h/2+100,WORLD.h/2-100);b.mass=350+rnd(0,120);b.r=12+Math.sqrt(b.mass)*.9;b.dead=0}
function updatePlayer(){
 if(player.dead){player.mass=529;player.x=0;player.y=0;player.dead=0}
 let speed=Math.max(1.7,8-Math.sqrt(player.mass)/19);
 player.x+=player.dirX*speed;player.y+=player.dirY*speed;clampEntity(player);eatFood(player);
 player.r=12+Math.sqrt(player.mass)*.9;
 for(let b of bots){
  if(b.dead)continue;
  let d=dist(player,b);
  if(d<Math.max(2,player.r-b.r*.25)){
   if(player.r>b.r*1.15){player.mass+=b.mass*.65;b.dead=1}
   else if(b.r>player.r*1.15){player.dead=1}
  }
 }
}
function updatePellets(){
 for(let i=pellets.length-1;i>=0;i--){
  let p=pellets[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.life--;
  for(let v of viruses){
   if(dist(p,v)<v.r+7){
    v.flash=20; v.r=42; pellets.splice(i,1); break
   }
  }
  if(i<pellets.length&&p.life<=0)pellets.splice(i,1);
 }
 for(let v of viruses)if(v.flash>0)v.flash--;
}
function updateParts(){
 for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.life--;if(p.life<=0){player.mass+=p.mass*.08;parts.splice(i,1)}}
}
function cleanup(){for(let b of bots)if(b.dead)respawnBot(b);while(food.length<500)food.push(newFood())}
let camX=0,camY=0;
function drawCircle(o,fill,stroke){
 ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}
}
function draw(){
 ctx.clearRect(0,0,W,H);
 camX+=(player.x-camX)*.1;camY+=(player.y-camY)*.1;
 ctx.save();ctx.translate(W/2-camX,H/2-camY);
 ctx.fillStyle="#f7f8f9";ctx.fillRect(-WORLD.w/2,-WORLD.h/2,WORLD.w,WORLD.h);
 ctx.strokeStyle="#d8dde1";ctx.lineWidth=1;
 for(let gx=-WORLD.w/2;gx<=WORLD.w/2;gx+=50){ctx.beginPath();ctx.moveTo(gx,-WORLD.h/2);ctx.lineTo(gx,WORLD.h/2);ctx.stroke()}
 for(let gy=-WORLD.h/2;gy<=WORLD.h/2;gy+=50){ctx.beginPath();ctx.moveTo(-WORLD.w/2,gy);ctx.lineTo(WORLD.w/2,gy);ctx.stroke()}
 for(let f of food)drawCircle(f,"#74c66d");
 for(let p of pellets)drawCircle(p,"#69b85f");
 for(let v of viruses){
  ctx.beginPath();for(let i=0;i<30;i++){let a=i*Math.PI*2/30,r=v.r*(i%2?.88:1);ctx.lineTo(v.x+Math.cos(a)*r,v.y+Math.sin(a)*r)}ctx.closePath();
  ctx.fillStyle=v.flash?"#8be38f":"#54b85d";ctx.fill();
 }
 for(let b of bots)if(!b.dead){drawCircle(b,colors[b.id%colors.length],"#ffffff");ctx.fillStyle="#fff";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText(b.name,b.x,b.y+4)}
 for(let p of parts)drawCircle(p,"#4e83d1","#fff");
 drawCircle(player,"#4e83d1","#fff");ctx.fillStyle="#fff";ctx.font="bold 14px system-ui";ctx.textAlign="center";ctx.fillText("YOU",player.x,player.y+5);
 ctx.strokeStyle="#999";ctx.lineWidth=8;ctx.strokeRect(-WORLD.w/2,-WORLD.h/2,WORLD.w,WORLD.h);
 ctx.restore();
 hudUpdate();
}
function loop(){updatePlayer();for(let b of bots)updateBot(b);updatePellets();updateParts();cleanup();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
